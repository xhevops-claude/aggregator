name: collector

services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27117"]
    ports:
      - "27117:27117"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --port
        - "27117"
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27117' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: collector
      RABBITMQ_DEFAULT_PASS: collector
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  workers:
    build:
      context: ..
      dockerfile: src/Collector.Workers/Dockerfile
    environment:
      COLLECTOR_ROLES: conductor,harvester,adapter,store-writer
      COLLECTOR_MONGO: mongodb://mongo:27117/?directConnection=true
      COLLECTOR_RABBIT: amqp://collector:collector@rabbitmq:5672/
      COLLECTOR_LAKE: /lake
    volumes:
      - ../.lake:/lake
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mongo-data:
  rabbitmq-data:
